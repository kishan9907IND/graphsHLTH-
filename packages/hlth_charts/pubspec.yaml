name: hlth_charts
description: Chart components for the HLTH health tracking app.
version: 0.0.2
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Charts are intentionally pure CustomPainter — fl_chart was evaluated
  # and dropped: its touch handling is tap-centred (desktop metaphor), and
  # the Figma's scrub interaction is a touch-drag with snap and haptics.
  # Owning the paint keeps that integration clean. If you later want
  # axis-ticks or legend helpers, fl_chart: ^0.69.0 slots in easily.

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter: {}
