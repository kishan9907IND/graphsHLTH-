name: Widgetbook

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when you push again to the same PR.
concurrency:
  group: widgetbook-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Generate story directories
        working-directory: widgetbook
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyse
        working-directory: widgetbook
        run: flutter analyze

      - name: Build web
        working-directory: widgetbook
        run: flutter build web --release

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy widgetbook/build/web
            --project-name=hlth-widgetbook
            --branch=${{ github.head_ref || github.ref_name }}

      # Drops the preview URL into the PR so you can paste it into a
      # Figma comment without digging through the Actions log.
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deploy.outputs.deployment-url }}`;
            if (!url) return;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Widgetbook preview: ${url}`,
            });
