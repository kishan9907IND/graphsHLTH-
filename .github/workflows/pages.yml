name: GitHub Pages

# Deploys the responsive Gallery (left metric rail + top screen-size tabs +
# device frame) to GitHub Pages on every push to main or a feature branch.
# Zero secrets, zero third-party account — this is the "open it in a new tab"
# preview. The Widgetbook component catalog deploys separately to Cloudflare.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: gallery
        run: flutter pub get

      - name: Analyse
        working-directory: gallery
        run: flutter analyze

      # GitHub Pages serves at /<repo-name>/, so the base href must match.
      - name: Build web
        working-directory: gallery
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gallery/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
