name: GitHub Pages

# Builds the responsive Gallery and publishes it to the `gh-pages` branch.
# Point Settings → Pages → Source at "Deploy from a branch" → gh-pages (root).
# This classic branch method avoids the Actions-source site-creation API,
# which the workflow token can't call on this repo.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: gallery
        run: flutter pub get

      - name: Analyse
        working-directory: gallery
        run: flutter analyze

      # Pages serves a project site at /<repo-name>/, so base-href must match.
      - name: Build web
        working-directory: gallery
        run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"

      # .nojekyll stops GitHub Pages' Jekyll from dropping Flutter's _* files.
      - name: Publish to gh-pages
        working-directory: gallery/build/web
        run: |
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${{ github.sha }}"
          git push -f \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages
